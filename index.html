<div style="background:#8b3f34;color:#fff;text-align:center;font:600 12px/1.4 'Segoe UI',sans-serif;padding:6px 10px">DEMO — all names and figures on this page are fictitious</div><!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172b25">
<title>Sales Dashboard DEMO — fictitious data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--forest:#263f36;--forest-deep:#172b25;--sage:#789184;
--bronze:#a87942;--bronze-dark:#835b2f;
--ivory:#f6f1e8;--paper:#fffdf9;--line:#ddd4c6;--ink:#25322d;--muted:#6b7770;
--grid:#e9e2d4;--weekend:#f1ebdf;--head:#ede7dd;--rail:#efe8dc;
--good:#2f7d55;--good-bar:#4e8267;--danger:#a8524a;--danger-bar:#b15b4b;
--ok-bg:#e3eee8;--ok-fg:#346d52;
--watch-bg:#f3e7d2;--watch-fg:#845d29;
--crit-bg:#f5dfdb;--crit-fg:#934438;
--off-bg:#e8e8e3;--off-fg:#68716c;
--shadow:0 7px 22px rgba(47,58,52,.055);
--fd:'Newsreader',Georgia,'Times New Roman',serif;
--fu:'Public Sans','Segoe UI',system-ui,-apple-system,sans-serif;
--r:16px}

/* Type scale — eight steps on a ~1.25 ratio. Every font-size in this sheet is
   one of these. Nothing in between; that in-between is what reads as amateur.
   12 label · 13 small · 15 body · 19 lead-in · 23 heading · 29 figure
   44 masthead · 68 statement                                              */

@media (prefers-color-scheme:dark){:root{
--ivory:#121d19;--paper:#1a2a24;--line:#31463d;--ink:#e9efeb;--muted:#a7b6ad;
--grid:#2b3d35;--weekend:#16241f;--head:#22342c;--rail:#22342c;
--bronze:#d0a26c;--bronze-dark:#e0b782;--sage:#8ea79a;
--good:#7fc79f;--good-bar:#5fa77f;--danger:#e0938a;--danger-bar:#c47163;
--ok-bg:#1c3a2c;--ok-fg:#8fd0ae;
--watch-bg:#3a2f16;--watch-fg:#e2be76;
--crit-bg:#3d211d;--crit-fg:#e8a196;
--off-bg:#25302b;--off-fg:#9aa8a0;
--shadow:0 7px 22px rgba(0,0,0,.35)}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--fu);
font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
text-rendering:optimizeLegibility}
h1,h2,h3{margin:0;font-family:var(--fd);font-weight:600;letter-spacing:-.015em;text-wrap:balance}
table,.num,.n,.v,.big{font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px 72px}
:focus-visible{outline:2px solid var(--bronze);outline-offset:2px;border-radius:6px}
/* bronze only clears 2.4:1 on the forest band — the masthead needs its own ring */
.hero :focus-visible{outline:2px solid #f0dcbe;outline-offset:2px}

/* Section eyebrow: numeral, hairline, label — the structure of a printed report */
.eyebrow{display:flex;align-items:center;margin:0 0 7px;font-size:12px;font-weight:600;
letter-spacing:.1em;text-transform:uppercase;color:var(--bronze-dark)}
.eyebrow .n{margin-right:11px;padding-right:11px;border-right:1px solid var(--line);
font-variant-numeric:tabular-nums}

/* ---------- masthead ---------- */
.hero{position:relative;overflow:hidden;color:#fff;
background:linear-gradient(152deg,#2c473d 0%,var(--forest) 42%,var(--forest-deep) 100%)}
.hero .deco{position:absolute;top:-140px;right:-120px;width:520px;height:520px;
pointer-events:none;opacity:.5}
/* bottom padding leaves the lead panel room to straddle the band without covering the chips */
/* Two columns: the title reads left, the year-to-date standing sits right against a
   rule. Left-stacking all four blocks left the right 40% of the band empty. */
.hero-in{position:relative;max-width:1240px;margin:0 auto;padding:34px 24px 50px;
display:grid;grid-template-columns:minmax(0,1fr) minmax(236px,300px);
column-gap:56px;grid-template-areas:"brow ytd" "title ytd" "sw sw";align-items:start}
.hero .eyebrow{grid-area:brow}
.hero h1{grid-area:title}
.hero .ytd{grid-area:ytd}
.hero .switch{grid-area:sw}
.hero .eyebrow{color:#c6a97e}
.hero .eyebrow .n{border-right-color:rgba(255,255,255,.28)}
.hero h1{font-size:clamp(29px,3.4vw,44px);line-height:1.14;letter-spacing:-.02em;
color:#fff;max-width:30ch}
.hero h1 em{font-style:normal;color:#e2c396}

/* ---------- year to date ---------- */
.ytd{margin:5px 0 0;padding:1px 0 1px 24px;border-left:1px solid rgba(255,255,255,.18);
max-width:none;font-size:15px;line-height:1.55;color:rgba(255,255,255,.74)}
.ytd b{color:#fff;font-weight:600}
.ytd .lab{display:block;margin-bottom:3px;font-size:12px;font-weight:600;
letter-spacing:.1em;text-transform:uppercase;color:#c6a97e}

/* ---------- month switcher ---------- */
.switch{margin-top:22px;border-top:1px solid rgba(255,255,255,.14);padding-top:15px}
.switch-lab{margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.08em;
text-transform:uppercase;color:rgba(255,255,255,.66)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:thin}
.chip{flex:1 0 70px;min-height:54px;padding:8px 7px 9px;cursor:pointer;text-align:center;
border:1px solid rgba(255,255,255,.2);border-bottom:3px solid transparent;
border-radius:3px 3px 0 0;background:rgba(255,255,255,.07);
color:rgba(255,255,255,.86);font-family:var(--fu);font-size:12px;font-weight:600;
letter-spacing:.06em;text-transform:uppercase;
transition:background .15s,border-color .15s,color .15s}
.chip .pc{display:block;margin-top:3px;font-family:var(--fd);font-size:15px;font-weight:500;
letter-spacing:0;text-transform:none}
.chip:hover:not([disabled]){background:rgba(255,255,255,.19);
border-color:rgba(255,255,255,.42);color:#fff}
.chip[aria-pressed="true"]{background:var(--paper);border-color:var(--paper);
border-bottom-color:var(--bronze);color:var(--forest-deep)}
.chip[aria-pressed="true"]:hover{background:#fff;border-color:#fff;
border-bottom-color:var(--bronze-dark);color:var(--forest-deep)}
.chip[aria-pressed="true"] .pc{color:var(--bronze-dark)}
.chip.hit .pc{color:#b7dcc4}
.chip[aria-pressed="true"].hit .pc{color:var(--good)}
.chip[disabled]{opacity:.34;cursor:not-allowed;border-style:dashed}

/* ---------- lead statement ----------
   Replaces the five-tile KPI strip. A board document opens with one figure and
   one sentence; the supporting numbers sit beside it as a ruled key-figures
   table, the way a financial summary page is set. */
.lead{position:relative;z-index:2;margin:-30px 0 0;display:grid;
grid-template-columns:minmax(0,1.3fr) minmax(276px,.85fr);gap:22px 48px;
background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
padding:32px 36px 34px;box-shadow:var(--shadow)}
/* the brand's status accent bar, carried by the statement rather than by tiles */
/* Status arrives as a rule ABOVE the statement, never as a bar down a card's left
   edge — that side-tab is the worn dashboard tell. A rule-above is how a report sets
   a section, and it lands this column on the same line as the key figures opposite. */
.lead-fig{border-top:2px solid var(--sage);padding-top:19px}
.lead-fig.is-good{border-top-color:var(--good-bar)}
.lead-fig.is-bad{border-top-color:var(--danger-bar)}
.lead-fig .per{margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.1em;
text-transform:uppercase;color:var(--muted)}
.lead-fig .v{font-family:var(--fd);font-size:clamp(44px,5.2vw,68px);font-weight:500;
line-height:1;letter-spacing:-.025em;color:var(--forest-deep)}
.lead-fig .say{margin:18px 0 0;max-width:52ch;font-size:19px;line-height:1.5;color:var(--ink)}
.lead-fig .say b{font-weight:600}
.mark{display:inline-block;margin:0 0 14px;padding:4px 13px;border-radius:3px;
font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.mark.good{background:var(--ok-bg);color:var(--ok-fg)}
.mark.mid{background:var(--watch-bg);color:var(--watch-fg)}
.mark.bad{background:var(--crit-bg);color:var(--crit-fg)}

.keyfig{align-self:start;border-top:1px solid var(--line)}
.keyfig .r{display:flex;justify-content:space-between;align-items:baseline;gap:22px;
padding:12px 0;border-bottom:1px solid var(--line)}
.keyfig .k{font-size:13px;line-height:1.35;color:var(--ink)}
.keyfig .k .s{display:block;margin-top:2px;font-size:12px;color:var(--muted)}
.keyfig .k .s.up{color:var(--good);font-weight:600}
.keyfig .k .s.down{color:var(--danger);font-weight:600}
.keyfig .n{flex:0 0 auto;font-family:var(--fd);font-size:23px;font-weight:500;
line-height:1.1;letter-spacing:-.015em;color:var(--forest-deep);white-space:nowrap}
@media (prefers-color-scheme:dark){.lead-fig .v,.keyfig .n{color:var(--ink)}}

/* ---------- panels ---------- */
/* start, not stretch — a short panel should end at its content, not trail dead space */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;margin-top:26px;align-items:start}

/* ---------- movements ----------
   Seven panels of equal weight gave the board no reading order. Two ruled breaks
   split the page into "are we hitting target" (01-03) and "what made up the month"
   (04-07) — the structure a report uses, carried by one rule and one numeral. */
.movement{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;
margin:18px 0 -6px;padding-top:22px;border-top:1px solid var(--line)}
.movement:first-child{margin-top:0;padding-top:2px;border-top:none}
.movement .rn{font-family:var(--fd);font-size:19px;font-weight:500;line-height:1;
color:var(--bronze-dark)}
.movement .rt{font-family:var(--fu);font-size:12px;font-weight:600;letter-spacing:.12em;
text-transform:uppercase;color:var(--muted)}
@media (prefers-color-scheme:dark){.movement .rn{color:var(--bronze)}}
.card{grid-column:span 6;background:var(--paper);border:1px solid var(--line);
border-radius:var(--r);padding:24px 26px;box-shadow:var(--shadow)}
.card.w{grid-column:1/-1}
.card.c7{grid-column:span 7}
.card.c5{grid-column:span 5}
.card h2{font-size:23px;line-height:1.25;color:var(--forest-deep)}
.card .sub{margin:5px 0 18px;font-size:13px;line-height:1.5;color:var(--muted)}
.card .note{margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line);
font-size:13px;line-height:1.5;color:var(--muted)}
.card .note b{color:var(--ink);font-weight:600}
.card .note.tight{margin:20px 0 10px;padding-top:14px}
@media (prefers-color-scheme:dark){.card h2{color:var(--ink)}}

.empty{margin:0;padding:14px 0;font-size:13px;color:var(--muted)}
.failure{border-top:3px solid var(--danger-bar)}
.failure .eyebrow{color:var(--danger)}
.failure .note{font-family:Consolas,ui-monospace,monospace;font-size:13px}
.pill{display:inline-block;padding:4px 12px;border-radius:3px;
font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.healthy{background:var(--ok-bg);color:var(--ok-fg)}
.watch{background:var(--watch-bg);color:var(--watch-fg)}
.critical{background:var(--crit-bg);color:var(--crit-fg)}

/* ---------- measured rows ---------- */
.br{display:grid;grid-template-columns:minmax(112px,1.1fr) minmax(80px,1.9fr) 156px;
gap:18px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.br:last-of-type{border-bottom:none}
.br .nm{font-size:15px;font-weight:600;line-height:1.3}
.br .nm .s{display:block;margin-top:3px;font-size:12px;font-weight:400;color:var(--muted)}
/* figures land on one axis across every row of a panel, like a statement column */
.br .val{text-align:right;font-size:12px;line-height:1.4;color:var(--muted);white-space:nowrap}
.br .val b{display:block;margin-bottom:1px;font-family:var(--fd);font-size:19px;
font-weight:500;letter-spacing:-.015em;color:var(--ink)}
.bullet{position:relative;height:10px;border-radius:2px;background:var(--rail)}
.bullet.na{background:none;border-top:1px dashed var(--line);height:1px;
border-radius:0;align-self:center}
.bullet .fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;
background:linear-gradient(90deg,#c8a372,var(--bronze-dark))}
.bullet .fill.ok{background:linear-gradient(90deg,#7fb198,var(--good-bar))}
.bullet .fill.bad{background:linear-gradient(90deg,#d29488,var(--danger-bar))}
.bullet .tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--forest-deep)}
@media (prefers-color-scheme:dark){.bullet .tick{background:var(--ink)}}

/* ---------- share rows ---------- */
.mix{margin-bottom:13px}
.mix:last-of-type{margin-bottom:0}
.mix .t{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
margin-bottom:6px;font-size:13px}
.mix .t .k{font-weight:600}
.mix .t .k.dim{font-weight:400;color:var(--muted)}
.mix .t .s{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.sbar{height:7px;border-radius:2px;background:var(--rail);overflow:hidden}
.sbar i{display:block;height:100%;background:linear-gradient(90deg,#c8a372,var(--bronze-dark))}
.mix.now .sbar i{background:linear-gradient(90deg,#8fbca3,var(--good-bar))}

/* ---------- twin stat ---------- */
.twin{display:flex;flex-wrap:wrap;gap:36px;margin-bottom:20px;
padding-bottom:18px;border-bottom:1px solid var(--line)}
.twin .big{font-family:var(--fd);font-size:29px;font-weight:500;line-height:1.1;
letter-spacing:-.02em;color:var(--forest-deep)}
.twin .cap{margin-top:3px;font-size:12px;color:var(--muted)}
@media (prefers-color-scheme:dark){.twin .big{color:var(--ink)}}

/* ---------- table ---------- */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{padding:0 14px 9px;color:var(--muted);
font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
text-align:left;white-space:nowrap;border-bottom:1px solid var(--ink)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
td.dim{color:var(--muted)}
td.amt{font-family:var(--fd);font-size:19px;font-weight:500;letter-spacing:-.015em}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--head)}
tbody tr:hover td.dim{color:var(--ink)}
tbody tr:hover td:first-child{background:var(--head)}
td.r,th.r{text-align:right}
/* The source's agent column also carries walk-ins and web leads. They stay in the
   table — dropping revenue would be worse — but below a labelled rule, so the partner
   count and total stated above it are actually a partner count and total. */
tbody tr.sep td{padding:20px 14px 8px;border-bottom:2px solid var(--line);
font-family:var(--fu);font-size:12px;font-weight:600;letter-spacing:.08em;
text-transform:uppercase;color:var(--muted)}
tbody tr.sep:hover td,tbody tr.sep:hover td:first-child{background:none}
tbody tr.direct td,tbody tr.direct td.amt{color:var(--muted)}
.tag{display:inline-block;padding:2px 9px;border:1px solid var(--line);border-radius:3px;
color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.07em}

/* ---------- chart ---------- */
/* Drawn at the container's real pixel width, so 1 viewBox unit = 1px and tick
   labels stay at their true size instead of shrinking with the viewport. */
.chartwrap{width:100%}
.chart{display:block;width:100%;height:auto}
.gl{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--ink);stroke-width:1.25}
.ytick,.xtick{fill:var(--muted);font-family:var(--fu)}
.ytick{text-anchor:end}
.xtick{text-anchor:middle}
/* sage carries "on target" everywhere else on the page — using it for "weekend" made
   the baseline markers read as a status. Weekends are context, so they sit in neutral. */
.wknd{fill:var(--muted);opacity:.5}
/* The brand bar gradient tops out at #c8a372, only 2.3:1 on paper — under the 3:1
   floor for a data mark. A bronze-dark hairline defines the shape without altering
   the brand fill. Hover darkens rather than fading, so contrast rises. */
.dbar{fill:url(#pmpBar);stroke:var(--bronze-dark);stroke-width:1;transition:fill .12s}
.dbar:hover{fill:var(--bronze-dark)}
.guide{stroke:var(--forest-deep);stroke-width:1.4;stroke-dasharray:5 4;opacity:.5}
@media (prefers-color-scheme:dark){.guide{stroke:var(--ink);opacity:.55}}
.legend{display:flex;flex-wrap:wrap;gap:10px 24px;margin-top:16px;padding-top:13px;
border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:14px;height:11px;flex:0 0 auto}
.legend i.bar{background:linear-gradient(180deg,#c8a372,var(--bronze-dark));
border:1px solid var(--bronze-dark)}
.legend i.wk{background:var(--muted);opacity:.5;height:3px}
.legend i.gd{height:0;width:18px;border-top:2px dashed var(--forest-deep);opacity:.6}
@media (prefers-color-scheme:dark){.legend i.gd{border-top-color:var(--ink)}}

/* ---------- disclosure ---------- */
details{margin-top:18px;background:var(--paper);border:1px solid var(--line);
border-radius:var(--r);box-shadow:var(--shadow)}
summary{display:flex;align-items:center;gap:12px;min-height:56px;padding:16px 26px;
cursor:pointer;list-style:none;font-family:var(--fd);font-size:19px;font-weight:600;
color:var(--forest-deep)}
summary::-webkit-details-marker{display:none}
summary:hover{background:var(--head);border-radius:var(--r)}
details[open] summary{border-radius:var(--r) var(--r) 0 0;border-bottom:1px solid var(--line)}
summary:focus-visible{outline:2px solid var(--bronze);outline-offset:-3px}
summary .tri{font-size:12px;color:var(--bronze);transition:transform .2s}
details[open] summary .tri{transform:rotate(90deg)}
@media (prefers-color-scheme:dark){summary{color:var(--ink)}}
.dbody{padding:6px 26px 20px}
.pi{display:flex;gap:18px;padding:16px 0;border-bottom:1px solid var(--line)}
.pi:last-child{border-bottom:none}
/* outlined numerals — six solid bronze discs spent the accent six times in one panel */
.pi .n{flex:0 0 auto;width:30px;height:30px;border-radius:50%;
display:flex;align-items:center;justify-content:center;
background:none;border:1px solid var(--line);color:var(--bronze-dark);
font-family:var(--fd);font-size:15px;font-weight:600}
.pi h3{margin:0 0 5px;font-size:19px;font-weight:600}
.pi p{margin:0;font-size:15px;line-height:1.55;color:var(--muted)}
.pi p b{color:var(--ink);font-weight:600}
code{padding:2px 6px;border-radius:3px;background:var(--head);color:var(--ink);
font-family:Consolas,ui-monospace,monospace;font-size:13px}

.foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
font-size:12px;line-height:1.6;color:var(--muted)}

/* ---------- responsive ---------- */
@media (max-width:1080px){
.card,.card.c7,.card.c5{grid-column:1/-1}
.hero .deco{opacity:.3}}

@media (max-width:900px){
/* the masthead's right column has no room to be a column — restack it */
.hero-in{grid-template-columns:1fr;column-gap:0;
grid-template-areas:"brow" "title" "ytd" "sw"}
.ytd{margin:18px 0 0;padding:16px 0 0;max-width:70ch;
border-left:none;border-top:1px solid rgba(255,255,255,.14)}
.lead{grid-template-columns:1fr;gap:26px;padding:28px}
.keyfig{border-top:none}
.keyfig .r:first-child{border-top:1px solid var(--line)}}

@media (max-width:820px){
.wrap{padding:0 20px 56px}
.hero-in{padding:28px 20px 46px}
.card{padding:22px}
.grid{gap:16px}}

@media (max-width:600px){
.wrap{padding:0 16px 46px}
/* keep bottom padding — the lead panel overlaps this space, not the chips */
.hero-in{padding:24px 16px 42px}
.hero h1{max-width:none}
.lead{padding:24px 20px;margin-top:-22px}
.lead-fig{padding-top:16px}
.card{padding:20px 18px}
.chip{flex:0 0 66px}
.br{grid-template-columns:1fr auto;gap:4px 14px;padding:16px 0}
.br .bullet{grid-column:1/-1;order:3;margin-top:9px}
.br .val{order:2;align-self:start}
.twin{gap:24px}
summary{padding:14px 18px}
.dbody{padding:6px 18px 16px}
/* first column stays pinned while the rest of the table scrolls under it */
.tw{border:1px solid var(--line);border-radius:3px}
.tw table{min-width:520px}
.tw th{padding:10px 14px}
.tw th:first-child,.tw td:first-child{position:sticky;left:0;z-index:1;
background:var(--paper);border-right:1px solid var(--line)}
.tw th:first-child{background:var(--head)}}

@media (max-width:380px){
.wrap{padding:0 13px 40px}
.hero-in{padding:20px 13px 38px}
.lead,.card{padding:18px 15px}
.twin{gap:18px}}

/* Motion here only ever confirms a state change that already happened, so removing
   it costs nothing. Colour and position feedback remain in every case. */
@media (prefers-reduced-motion:reduce){
*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
transition-duration:.01ms !important;scroll-behavior:auto !important}
details[open] summary .tri{transform:none;font-size:0}
details[open] summary .tri::after{content:'\25BC';font-size:12px}}

@media print{
/* nothing on paper below 12pt */
body{background:#fff}
body,table,.card .sub,.card .note,.mix .t,.br .val,.br .nm .s,.keyfig .k,.keyfig .k .s,
.pi p,.foot,.legend,.empty,.eyebrow,th,.tag,.pill,.mark,.twin .cap,code,
.movement .rt{font-size:12pt;line-height:1.45}
.movement .rn{font-size:15pt}
.movement{margin:14px 0 0;padding-top:12px;break-after:avoid}
.hero h1{font-size:26pt}
.ytd{font-size:13pt}
.lead-fig .say{font-size:14pt}
.lead-fig .v{font-size:38pt}
.card h2,.keyfig .n{font-size:17pt}
.pi h3{font-size:14pt}
.br .nm{font-size:13pt}
.br .val b,td.amt,.twin .big{font-size:14pt}
.hero{background:#fff;color:var(--ink)}
.hero h1,.hero h1 em{color:var(--forest-deep)}
.hero .eyebrow{color:var(--bronze-dark)}
.hero .eyebrow .n{border-right-color:var(--line)}
.ytd{color:var(--ink);border-top-color:var(--line);border-left-color:var(--line)}
.ytd b{color:var(--ink)}
.ytd .lab{color:var(--bronze-dark)}
.switch,.deco{display:none}
.lead{margin-top:20px;break-inside:avoid}
.card,.lead,details{box-shadow:none;break-inside:avoid}
.card.c7,.card.c5,.card{grid-column:1/-1}
/* drawn 1:1 for print, so 16-unit axis text lands at exactly 12pt */
.chart{width:auto;max-width:100%}
details{display:none}}

/* mobile hardening — appended */
.hero-in > *{min-width:0}
.grid > *{min-width:0}
@media (max-width:640px){
  h1{font-size:24px}
  #ytd{font-size:13px}
  .hero,.hero-in{overflow-x:hidden}
  img,svg{max-width:100%}
}

.dstrip{grid-column:1/-1;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.dshead{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 14px;margin-bottom:7px}
.dshead .lab{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--bronze-dk)}
.dslatest{font-size:12.5px;color:var(--muted)}
.dslatest b{color:var(--ink);font-variant-numeric:tabular-nums}
.dsbars{display:flex;gap:3px;align-items:flex-end;height:52px}
.dscol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px}
.dscol i{display:block;width:100%;max-width:26px;background:var(--bronze);border-radius:2px 2px 0 0}
.dscol span{font-size:9px;color:var(--tick)}
@media (max-width:640px){.dscol span{font-size:8px}.dslatest{font-size:11.5px}}

.pbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 2px;justify-content:flex-end}
.pbtn{font:600 12px/1 'Segoe UI',sans-serif;padding:8px 14px;border-radius:7px;
border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;min-height:36px}
.pbtn:hover{border-color:var(--bronze);color:var(--bronze-dk)}
.pbtn:active{transform:scale(.97)}
.pbtn:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
.pstale{font-size:11.5px;color:var(--muted);margin-left:auto}
.pstale.warn{color:#8b3f34;font-weight:700}
@media print{.pbar{display:none !important}}

#livetip{display:none;position:fixed;z-index:99;background:var(--forest-deep);color:#fff;
font:600 12px/1.45 'Segoe UI',sans-serif;padding:7px 11px;border-radius:7px;pointer-events:none;
box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:240px;white-space:nowrap}
.dbar{cursor:pointer}
.dbar:hover{filter:brightness(1.18)}
.dscol{cursor:pointer}
@media print{#livetip{display:none !important}}
</style>

function fmt(v){var a=Math.abs(v),s=v<0?'-':'';
if(a>=1e6)return s+'RM '+(a/1e6).toFixed(2)+'m';
if(a>=1e3)return s+'RM '+Math.round(a).toLocaleString('en-US');
return s+'RM '+Math.round(a);}
function pct(v){return Math.round(v*100)+'%';}
function cls(p){return p>=1?'healthy':(p>=.7?'watch':(p>=.4?'watch':'critical'));}
function lbl(p){return p>=1?'On target':(p>=.7?'Close':(p>=.4?'Behind':'Far behind'));}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}

/* Bullet bars run to 150% of target so an over-performing month is unmistakably
   past the tick rather than pinned against the end of the rail. */
var CAP=1.5;
function bullet(a,t){var p=t>0?a/t:0,w=Math.min(p,CAP)/CAP*100,tick=100/CAP;
var c=p>=1?'ok':(p>=.4?'':'bad');
return '<div class="bullet" role="img" aria-label="'+pct(p)+' of target">'+
'<span class="fill '+c+'" style="width:'+w.toFixed(1)+'%"></span>'+
'<span class="tick" style="left:'+tick.toFixed(1)+'%"></span></div>';}
function sbar(v,mx){return '<div class="sbar"><i style="width:'+
(mx>0?Math.min(v/mx*100,100):0).toFixed(1)+'%"></i></div>';}
/* no target on record — a hairline keeps the column rhythm without drawing a 0% bar */
function norail(){return '<div class="bullet na" aria-hidden="true"></div>';}

/* top-rounded bar path — SVG rx would round all four corners */
function barPath(x,y,w,h){var r=Math.min(4,w/2,h);
return 'M'+x.toFixed(1)+' '+(y+h).toFixed(1)+'V'+(y+r).toFixed(1)+
'Q'+x.toFixed(1)+' '+y.toFixed(1)+' '+(x+r).toFixed(1)+' '+y.toFixed(1)+
'H'+(x+w-r).toFixed(1)+'Q'+(x+w).toFixed(1)+' '+y.toFixed(1)+' '+(x+w).toFixed(1)+' '+(y+r).toFixed(1)+
'V'+(y+h).toFixed(1)+'Z';}

var a=Math.abs(v);
if(a>=1e6)return (a/1e6).toFixed(1)+'m';
if(a>=1e3)return Math.round(a/1e3)+'k';
return String(Math.round(a));}

/* A published chart lands on round numbers. Scaling the axis to the tallest bar gave
   ticks like "RM 181,084" — a data artefact, not a figure a reader can hold. This picks
   a 1/2/2.5/4/5 x 10^n step so every gridline reads as money. */
function niceStep(raw,divs){
var rough=raw/divs,mag=Math.pow(10,Math.floor(Math.log(rough)/Math.LN10)),f=rough/mag;
return mag*(f<=1?1:(f<=2?2:(f<=2.5?2.5:(f<=4?4:(f<=5?5:10)))));}

/* ts = tick text size in viewBox units. Screen uses 12.5; print draws the chart 1:1
   at 16 units so the axis prints at exactly 12pt. The gutter scales with it. */
function dailySVG(M,w,ts){
ts=ts||13;
var k2=ts/13,narrow=w<560;
var h=Math.round((w<560?230:(w<900?250:270))+(ts-13)*3);
var pl=Math.round((narrow?42:90)*k2),pr=narrow?8:14,pb=Math.round((narrow?30:32)*k2),pt=16,n=M.dim;
var raw=1;for(var k in M.days)raw=Math.max(raw,M.days[k][0]);
var guide=M.target/M.dim;raw=Math.max(raw*1.06,guide*1.15);
var divs=narrow?2:4,step=niceStep(raw,divs),mx=step*divs;
var iw=w-pl-pr,ih=h-pb-pt,bw=iw/n,s='';

/* weekend bands first so bars and gridlines sit above them */
var firstDow=new Date(YR,M.m-1,1).getDay();
for(var d=1;d<=n;d++){var dow=(firstDow+d-1)%7;
if(dow===0||dow===6)s+='<rect class="wknd" x="'+(pl+bw*(d-1)).toFixed(1)+'" y="'+(pt+ih+2)+
'" width="'+bw.toFixed(1)+'" height="3"/>';}

for(var g=0;g<=divs;g++){var y=pt+ih-ih*g/divs;
if(g>0)s+='<line x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(w-pr)+'" y2="'+y.toFixed(1)+'" class="gl"/>';
s+='<text x="'+(pl-10)+'" y="'+(y+ts*.35).toFixed(1)+'" class="ytick" font-size="'+ts+'">'+
fmtAxis(step*g,narrow)+'</text>';}

/* thin the day labels so they never collide once bars get narrow */
var step=bw<9*k2?10:5;
for(var d2=1;d2<=n;d2++){var x0=pl+bw*(d2-1);
var v=M.days[d2]?M.days[d2][0]:0;
if(v>0){var hh=Math.max(ih*v/mx,2);
s+='<path class="dbar" data-tip="'+d2+' '+M.name+' — '+fmt(v)+' · '+M.days[d2][1]+' sale'+(M.days[d2][1]===1?'':'s')+'" d="'+barPath(x0+bw*.21,pt+ih-hh,bw*.58,hh)+'"><title>'+
d2+' '+M.name+': '+fmt(v)+' &#183; '+M.days[d2][1]+' sale'+(M.days[d2][1]===1?'':'s')+'</title></path>';}
if(d2===1||(d2%step===0&&d2<=n-2))
s+='<text x="'+(x0+bw/2).toFixed(1)+'" y="'+(h-Math.round(10*k2))+'" class="xtick" font-size="'+
ts+'">'+d2+'</text>';}

/* the pace figure lives in the legend, not on the plot — an in-chart label
   collides with whichever bar happens to be tall that month */
var gy=pt+ih-ih*guide/mx;
s+='<line x1="'+pl+'" y1="'+gy.toFixed(1)+'" x2="'+(w-pr)+'" y2="'+gy.toFixed(1)+'" class="guide"/>';
/* a weighted zero baseline — the rule every printed chart sits on */
s+='<line x1="'+pl+'" y1="'+(pt+ih)+'" x2="'+(w-pr)+'" y2="'+(pt+ih)+'" class="axis"/>';
/* A screen reader gets no shape from the bars, so the label carries the numbers */
var sold=Object.keys(M.days).length;
return '<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" class="chart" role="img" '+
'aria-label="Daily sales for '+M.name+'. '+fmt(M.rev)+' across '+M.n+' sales on '+sold+
' trading days. Best day '+M.best_day.d+' '+M.name+' at '+fmt(M.best_day.rev)+
'. Reaching target needs '+fmt(guide)+' a day.">'+s+'</svg>';}

/* Redraw the chart against the live container width. Called after every render and,
   debounced, on resize — so the axis text is always true-size, never scaled down. */
var CUR=null,rt=null;
function drawChart(pw,pts){
var box=document.getElementById('chartwrap');
if(!box||CUR===null)return;
var w=pw||Math.max(280,Math.round(box.clientWidth||box.getBoundingClientRect().width||900));
box.innerHTML=dailySVG(D.months[CUR-1],w,pts);}
window.addEventListener('resize',function(){
clearTimeout(rt);rt=setTimeout(function(){drawChart();},140);});
/* 620 units = 6.46in, so the printed chart is 1:1 and its 16-unit axis text is 12pt */
window.addEventListener('beforeprint',function(){drawChart(620,16);});
window.addEventListener('afterprint',function(){drawChart();});

document.getElementById('foot').innerHTML='Source: demo-data.xlsx ('+D.ytd_n+' sales to '+D.as_of+'), verified against platform records (354/354, no phantom sales). Targets: All Park KPI / Monthly Group &amp; Personal Sales v1.0. Kulai park only &mdash; UC and Ipoh files not current.';

var start=D.el;
try{var saved=+localStorage.getItem(STORE);
if(saved>=1&&saved<=D.el)start=saved;}catch(e){}
render(start);
}

/* A board pack that silently renders half a page is worse than one that says it broke.
   If the source data is malformed, say so instead of leaving a white screen. */
try{boot();}
catch(err){
var m=document.getElementById('main');
if(m)m.insertAdjacentHTML('afterbegin',
'<div class="card w failure" role="alert" data-od-id="load-failure">'+
'<p class="eyebrow">Dashboard could not load</p>'+
'<h2>The figures did not render</h2>'+
'<p class="sub">The source data was rejected while building this page, so nothing shown '+
'below is reliable. Rebuild the dashboard from the current monthly file rather than '+
'reading a partial view.</p>'+
'<p class="note"><b>Technical detail</b><br>'+esc((err&&err.message)||err)+'</p></div>');
}

/* ---- premium: print, copy summary, staleness, keyboard + swipe nav ---- */
(function(){
var bar=document.createElement('div');bar.className='pbar';
bar.innerHTML='<button class="pbtn" id="btnPrint" title="Print or save as PDF">Print report</button>'+
'<button class="pbtn" id="btnCopy" title="Copy this month summary">Copy summary</button>'+
'<span class="pstale" id="staleBadge"></span>';
var lead=document.getElementById('lead');
if(lead&&lead.parentNode)lead.parentNode.insertBefore(bar,lead.nextSibling);
document.getElementById('btnPrint').addEventListener('click',function(){window.print();});
document.getElementById('btnCopy').addEventListener('click',function(){
var M=D.months[(CUR||D.el)-1];var p=M.target>0?M.rev/M.target:0;
var t=M.name+' 2026 - Kulai\nSales: '+fmt(M.rev)+' ('+M.n+' sales)\nTarget: '+fmt(M.target)+' ('+pct(p)+')\nAs of '+D.as_of;
(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){
var b=document.getElementById('btnCopy');b.textContent='Copied';setTimeout(function(){b.textContent='Copy summary';},1600);
}).catch(function(){});});
var age=Math.floor((new Date()-new Date(D.as_of))/86400000);
var sb=document.getElementById('staleBadge');
if(age>7){sb.textContent='Data is '+age+' days old - export a fresh file';sb.className='pstale warn';}
else{sb.textContent='Data to '+D.as_of;}
document.addEventListener('keydown',function(e){
if(e.key==='ArrowLeft'&&CUR>1)render(CUR-1);
if(e.key==='ArrowRight'&&CUR<D.el)render(CUR+1);});
var tx=null;
document.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',function(e){
if(tx===null)return;var dx=e.changedTouches[0].clientX-tx;tx=null;
if(Math.abs(dx)<70)return;
if(dx>0&&CUR>1)render(CUR-1);
if(dx<0&&CUR<D.el)render(CUR+1);},{passive:true});

var tip=document.createElement('div');tip.id='livetip';document.body.appendChild(tip);
function showTip(t,x,y){tip.textContent=t;tip.style.display='block';
var r=tip.getBoundingClientRect();
var lx=Math.min(Math.max(8,x+14),window.innerWidth-r.width-8);
var ly=y-r.height-12;if(ly<8)ly=y+18;
tip.style.left=lx+'px';tip.style.top=ly+'px';}
function hideTip(){tip.style.display='none';}
document.addEventListener('pointermove',function(e){
var el=e.target.closest?e.target.closest('[data-tip]'):null;
if(el)showTip(el.getAttribute('data-tip'),e.clientX,e.clientY);else hideTip();},{passive:true});
document.addEventListener('pointerdown',function(e){
var el=e.target.closest?e.target.closest('[data-tip]'):null;
if(el)showTip(el.getAttribute('data-tip'),e.clientX,e.clientY);},{passive:true});
document.addEventListener('scroll',hideTip,{passive:true});
})();
</script>
</body></html>
